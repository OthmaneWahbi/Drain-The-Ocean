name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Télécharger Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          ./godot --headless --version

      - name: Importer le projet
        # Premier import : génère .godot/ (classes globales, traductions).
        run: ./godot --headless --path game --import

      - name: Lancer les tests
        # Une erreur de script pendant un test ne le fait pas échouer tout seul : on la cherche aussi.
        run: |
          set -o pipefail
          ./godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee tests.log
          ! grep -q "SCRIPT ERROR" tests.log

      - name: Scénario anti-blocage (vrai moteur physique)
        run: ./godot --headless --path game -s res://tests/scenarios/softlock.gd

      - name: Scénario de perf (rapport, et pas d'erreur de script)
        run: |
          set -o pipefail
          ./godot --headless --path game -s res://tests/scenarios/perf.gd 2>&1 | tee perf.log
          ! grep -q "SCRIPT ERROR" perf.log

      - name: Lancer la scène principale (fumée)
        run: |
          set -o pipefail
          ./godot --headless --path game --quit-after 120 2>&1 | tee smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log

      - name: Lancer la partie sans le menu principal (fumée)
        run: |
          set -o pipefail
          DTO_SKIP_MENU=1 ./godot --headless --path game --quit-after 120 2>&1 | tee smoke2.log
          ! grep -q "SCRIPT ERROR" smoke2.log

      # 0.1.8 : le vrai jeu avec affichage (écran virtuel), joué par un robot puis au hasard.
      - name: Écran virtuel pour les parties jouées
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Partie jouée par un robot (playtest)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 640x360x24" ./godot --path game --rendering-driver opengl3 --resolution 640x360 -s res://tests/scenarios/playtest.gd 2>&1 | tee playtest.log
          ! grep -qE "SCRIPT ERROR|triangulation failed|Lambda capture" playtest.log

      - name: Entrées au hasard (singe, 60 s)
        run: |
          set -o pipefail
          MONKEY_SEED=1 MONKEY_S=60 xvfb-run -a -s "-screen 0 480x270x24" ./godot --path game --rendering-driver opengl3 --resolution 480x270 -s res://tests/scenarios/monkey.gd 2>&1 | tee monkey.log
          grep -q "singe :" monkey.log
          ! grep -qE "SCRIPT ERROR|triangulation failed|Lambda capture" monkey.log
